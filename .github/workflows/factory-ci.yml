# Managed by the software factory (tl-innovations/software-factory). Edits here are overwritten by `factory sync`.
#
# Runs every command listed in .factory/product.json → "ci" (lint, typecheck, test, build, ...).
# Deploys are left to your host's Git integration (Vercel / Netlify / Cloudflare preview + production).
name: factory-ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: factory-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    uses: "tl-innovations/software-factory/.github/workflows/ci.yml@main"
